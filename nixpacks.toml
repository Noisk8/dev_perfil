# Railway / Nixpacks config to ensure static collection and proper start command

[phases.setup]
commands = ["pip install -r requirements.txt"]

[phases.build]
commands = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn perfil_noisk8.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
