# Railway / Nixpacks config to ensure static collection and proper start command

[phases.setup]
commands = [
  "apt-get update && apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev libssl-dev fonts-dejavu-core && rm -rf /var/lib/apt/lists/*",
  "pip install -r requirements.txt"
]

[phases.build]
commands = [
  "python manage.py collectstatic --noinput",
  "python manage.py migrate --noinput"
]

[start]
cmd = "gunicorn perfil_noisk8.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
