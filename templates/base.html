{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noisk8 | Perfil</title>
    <link rel="stylesheet" href="{% static 'portfolio/styles.css' %}">
</head>
<body>
    <div class="page">
        <header class="hero">
            <div class="hero__content">
                <p class="eyebrow">Perfil dev · livecoding · sysadmin</p>
                <h1>{{ profile.name }}</h1>
                <p class="tagline">{{ profile.tagline }}</p>
                <p class="bio">{{ profile.bio }}</p>
                <div class="meta">
                    <span class="pill">📍 {{ profile.location }}</span>
                    <a href="{{ profile.links.github }}" class="pill" target="_blank" rel="noreferrer">GitHub</a>
                    <a href="{{ profile.links.website }}" class="pill" target="_blank" rel="noreferrer">Portfolio</a>
                    <a href="{{ profile.links.twitter }}" class="pill" target="_blank" rel="noreferrer">X/Twitter</a>
                </div>
            </div>
            <div class="hero__visual">
                <div class="orb orb--primary"></div>
                <div class="orb orb--secondary"></div>
                <div class="hero__badge">
                    <p>Python · Linux · Frontend</p>
                    <span>Hands-on + experimental</span>
                </div>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
