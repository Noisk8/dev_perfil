{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ request.LANGUAGE_CODE|default:'es' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noisk8 | Perfil</title>
    <link rel="stylesheet" href="{% static 'portfolio/styles.css' %}">
</head>
<body>
    <header class="lang-switch">
        <form action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.path }}">
            <label for="language">{% trans "Idioma" %}:</label>
            <select name="language" id="language" onchange="this.form.submit()">
                <option value="es"{% if request.LANGUAGE_CODE == 'es' %} selected{% endif %}>Español</option>
                <option value="en"{% if request.LANGUAGE_CODE == 'en' %} selected{% endif %}>English</option>
            </select>
        </form>
    </header>
    <main class="page page--cv">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
